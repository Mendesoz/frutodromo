name: Base online da fazenda
on:
  push:
    branches: ['codex/**', 'claude/**']
    paths: ['server/**', '.github/workflows/fazenda-online.yml']
  pull_request:
    paths: ['server/**', '.github/workflows/fazenda-online.yml']
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: brotalume_test
          POSTGRES_USER: brotalume
          POSTGRES_PASSWORD: test_only_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      TEST_DATABASE_URL: postgresql://brotalume:test_only_ci@127.0.0.1:5432/brotalume_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run verify
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: node --check ../js/game.js && node --check ../js/i18n.js
